<!-- Écran de l'extension « Objectifs ».

     UN ONGLET DE LA PAGE BUDGET (cf. le manifeste : navigation.type =
     "onglet", hote_section = "budget"), à côté du budget du mois et des
     projets. Les trois répondent à la même question — qu'est-ce que je décide
     À L'AVANCE — là où le dashboard ne fait que constater.

     CE QUE LE BUDGET NE SAIT PAS DIRE, et qui justifie cet onglet de plus : une
     enveloppe compte des euros dépensés, un objectif de répartition une part du
     total. Ni l'un ni l'autre ne sait écrire « pas plus de quatre sorties par
     semaine » ni « mes courses ne devraient pas dépasser 40 € en moyenne » —
     un NOMBRE de fois et une MOYENNE ne sont pas des montants, et c'est
     pourtant sous cette forme-là qu'on se donne la plupart de ses règles.

     D'où la dépendance déclarée (`requiert_une_de`) : sans l'extension
     « Budget », cette page n'existe pas et un onglet n'a pas d'hôte. Le noyau
     grise la case, refuse l'allumage et éteint l'extension avec sa dépendance.

     C'est une `.sous-section` : c'est le gestionnaire délégué de app.js qui la
     montre et la cache, exactement comme un onglet du noyau.

     PAS DE SÉLECTEUR DE MONNAIE, D'ANNÉE NI DE MOIS, et c'est un retrait
     réfléchi. Cette page-ci n'est pas un écran de lecture : on y vient POSER
     des règles, et les relire. La lecture, elle, se fait au dashboard, qui a
     déjà ses onglets de monnaie et son sélecteur de période — c'est là qu'un
     objectif sert, devant les dépenses du mois. Trois listes déroulantes
     posaient ici la même question une seconde fois, pour un chiffre qu'on ne
     vient pas y chercher ; pire, l'onglet de monnaie CACHAIT la moitié de la
     liste à qui tient deux devises, sans que rien ne le dise. Les objectifs
     sont donc tous montrés, chacun mesuré dans sa propre monnaie sur le MOIS
     EN COURS — la période la plus probable, et celle qu'on ne choisit pas. -->
<div id="sous-section-budget-objectifs" class="sous-section">
  <h3>Objectifs<i class="info-bulle" tabindex="0" data-info-cle="objectifs.objectifs">i</i></h3>

  <div class="actions">
    <button type="button" class="primary" id="btn-objectif-nouveau">+ Nouvel objectif</button>
  </div>

  <!-- Le formulaire de création / modification. Replié tant qu'on ne l'ouvre
       pas : la liste est ce qu'on vient lire. -->
  <div id="objectif-editeur" class="regle-editeur" style="display:none">
    <h4 id="objectif-editeur-titre">Nouvel objectif</h4>
    <input type="hidden" id="objectif-id" />

    <div class="regle-champ-ligne">
      <label for="objectif-nom">Nom</label>
      <input type="text" id="objectif-nom" placeholder="ex. Sorties restaurant" />
    </div>

    <div class="regle-champ-ligne">
      <label for="objectif-mesure">Ce qu'on mesure<i class="info-bulle" tabindex="0" data-info-cle="objectifs.mesure">i</i></label>
      <select id="objectif-mesure">
        <option value="nombre">Nombre de dépenses</option>
        <option value="montant_total">Montant total</option>
        <option value="montant_moyen">Montant moyen d'une dépense</option>
        <option value="part_depenses">Part des dépenses</option>
      </select>
    </div>

    <!-- LE PÉRIMÈTRE, EN UNE SEULE LISTE : toutes les dépenses, une CATÉGORIE
         ou un PROJET. Les options sont posées par le JS, en deux groupes —
         une catégorie classe par NATURE, un projet regroupe par ÉVÉNEMENT, et
         les deux se croisent (l'hôtel d'un voyage est dans « Loisirs » ET dans
         « Italie »). D'où une liste et non deux : on choisit un axe, jamais les
         deux à la fois, et le serveur le refuse (cf. models.ObjectifKpi). -->
    <div class="regle-champ-ligne">
      <label for="objectif-perimetre">Sur<i class="info-bulle" tabindex="0" data-info-cle="objectifs.perimetre">i</i></label>
      <select id="objectif-perimetre">
        <option value="">Toutes les dépenses</option>
      </select>
    </div>

    <!-- LA CADENCE NE PARAÎT QUE POUR LES MESURES QUI CUMULENT. Un montant
         MOYEN et une PART sont des rapports : ils ne grandissent pas avec la
         durée, et « par semaine » n'y voudrait rien dire. Masquer le champ est
         plus honnête que le laisser sans effet (cf. objectifs.js,
         majChampsObjectif). -->
    <div class="regle-champ-ligne" id="objectif-ligne-cadence">
      <label for="objectif-cadence">Par<i class="info-bulle" tabindex="0" data-info-cle="objectifs.cadence">i</i></label>
      <select id="objectif-cadence">
        <option value="semaine">Semaine</option>
        <option value="mois" selected>Mois</option>
      </select>
    </div>

    <!-- SE FIXER UNE CIBLE EST FACULTATIF (migration 0070). Un projet qu'on
         commence à suivre est le cas ordinaire : on veut voir ce qu'il coûte,
         mois après mois, bien avant de savoir ce qu'on s'autorise. Sans cette
         case, il fallait inventer un nombre — et l'objectif annonçait aussitôt
         « tenu » ou « manqué » sur une règle que personne ne s'était donnée. -->
    <div class="regle-champ-ligne">
      <label for="objectif-avec-cible">Se fixer une cible<i class="info-bulle" tabindex="0" data-info-cle="objectifs.avec-cible">i</i></label>
      <input type="checkbox" id="objectif-avec-cible" checked />
    </div>

    <div class="regle-champ-ligne" id="objectif-ligne-sens">
      <label for="objectif-sens">Objectif</label>
      <select id="objectif-sens">
        <option value="max">Ne pas dépasser</option>
        <option value="min">Atteindre au moins</option>
      </select>
    </div>

    <div class="regle-champ-ligne" id="objectif-ligne-cible">
      <label for="objectif-cible">Cible</label>
      <input type="number" id="objectif-cible" step="0.01" min="0" />
      <span class="hint" id="objectif-cible-unite"></span>
    </div>

    <div class="regle-champ-ligne" id="objectif-ligne-monnaie">
      <label for="objectif-monnaie-champ">Monnaie</label>
      <select id="objectif-monnaie-champ"></select>
    </div>

    <div class="regle-champ-ligne">
      <label for="objectif-visible">Afficher au dashboard<i class="info-bulle" tabindex="0" data-info-cle="objectifs.visible-dashboard">i</i></label>
      <input type="checkbox" id="objectif-visible" checked />
    </div>

    <div class="actions">
      <button type="button" class="primary" id="btn-objectif-enregistrer">Enregistrer</button>
      <button type="button" id="btn-objectif-annuler">Annuler</button>
    </div>
  </div>

  <div id="objectifs-liste" class="obj-liste"></div>
</div>
