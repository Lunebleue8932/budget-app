<!-- Écran de l'extension « Budget ».

     UNE PAGE, ET PLUS UN ONGLET DE LA VUE GLOBALE DES COMPTES (cf. le
     manifeste : navigation.type = "page", position 1 — juste après le
     dashboard, dont elle est la question posée à l'avance).

     POURQUOI ELLE A GRANDI. Le budget du mois se saisissait SUR le camembert
     du dashboard, et les budgets par catégorie ligne par ligne dans le
     formulaire de la page Catégories. Trois grandeurs qui se répondent (cf.
     crud.incoherences_budgets), réglées à trois endroits dont aucun ne
     s'appelait « budget » — et, pour deux d'entre elles, au milieu d'écrans
     qui servent à CONSTATER. Un champ à remplir posé entre deux graphes fait
     tache : on vient y lire ce qui s'est passé, pas y décider ce qui devrait.

     ELLE PORTE DES ONGLETS (`#budget-sous-nav`), parce que « Projets » est
     venu s'y ranger : un projet est une enveloppe qu'on se donne pour un
     voyage ou un déménagement, exactement la même nature de décision que le
     budget d'un mois. La barre reste masquée tant qu'elle n'a qu'un onglet —
     c'est le noyau qui s'en charge (cf. extensions.js, majBarreOnglets).

     TROIS RANGÉES D'ONGLETS, C'ÉTAIT TROP. Monnaie, année, mois : trois
     rangées empilées sous une quatrième, pour trois choix qu'on fait une fois
     en arrivant et qu'on ne rouvre plus. Elles tiennent maintenant dans UNE
     barre de trois listes déroulantes. Les onglets d'année et de mois
     appartiennent aux écrans qu'on PARCOURT (le dashboard, les opérations, où
     l'on saute de mois en mois pour comparer) ; ici on pose un budget, puis on
     s'en va.

     Les mois y sont TOUS les douze, et les années débordent de ce que la base
     contient : un budget se pose souvent sur un mois où l'on n'a encore rien
     dépensé, et les périodes de `/meta/periodes` — celles qui PORTENT des
     opérations — n'auraient pas proposé le mois prochain.

     C'est un <section>, comme les écrans du noyau : switchSection la montre et
     la masque exactement de la même façon. -->
<section id="section-budget">
  <h2>Budget</h2>

  <!-- DEUX ONGLETS DU NOYAU DE CETTE PAGE, et « Projets » vient s'y ranger en
       troisième. La répartition par catégorie a sa page à elle parce qu'elle ne
       se lit pas comme le reste : c'est un TABLEAU qu'on parcourt ligne à ligne
       en poussant des curseurs, souvent longuement, et il poussait à lui seul
       l'épargne, le matelas et les imprévues hors de l'écran. Les trois
       lectures du bas répondent à « qu'est-ce qui s'est passé » ; ce tableau-là
       demande « qu'est-ce que je décide », et les deux gestes n'ont pas la même
       durée. -->
  <div class="sous-onglets" id="budget-sous-nav">
    <button type="button" data-sous-section="budget-budget" class="active">Budget</button>
    <button type="button" data-sous-section="budget-categories">Budgets par catégorie</button>
  </div>

  <div id="sous-section-budget-budget" class="sous-section active">

    <div class="selecteur-contexte ab-contexte">
      <label for="ab-monnaie">Monnaie
        <select id="ab-monnaie"></select>
      </label>
      <label for="ab-annee">Année
        <select id="ab-annee"></select>
      </label>
      <label for="ab-mois">Mois
        <select id="ab-mois"></select>
      </label>
    </div>

    <!-- ---------- LE BUDGET DU MOIS ---------- -->
    <h3>Budget du mois<i class="info-bulle" tabindex="0" data-info-cle="analyse-budget.budget-total">i</i></h3>

    <!-- LE RÉGLAGE SE PORTE COMME UN FILTRE, hors formulaire : un <input> hors
         <form> ne reçoit AUCUN style de l'application (`form input` ne descend
         que dans un formulaire), et l'envelopper ferait recharger la page à la
         moindre touche Entrée. C'est la forme qu'il avait déjà sur le camembert,
         reprise telle quelle — elle n'était pas le problème, sa PLACE l'était. -->
    <div class="reglage-ligne ab-budget-total-reglage">
      <label for="ab-budget-total">Montant du budget</label>
      <input type="number" id="ab-budget-total" step="0.01" min="0" />
      <!-- UN BUDGET QUE PERSONNE N'A ÉCRIT SUR CE MOIS-CI LE DIT (cf.
           crud._budget_herite). L'héritage remonte aussi le temps : sans cette
           mention, un mois antérieur à toute saisie afficherait un montant qui
           n'y a jamais été posé, et passerait pour une saisie oubliée. -->
      <span class="badge-aucun" id="ab-budget-total-herite" hidden>hérité</span>
      <button type="button" class="primary" id="btn-ab-budget-total">Enregistrer</button>
    </div>

    <!-- ---------- LES DEUX GRAPHES DU DASHBOARD, FACE AU BUDGET ----------
         Les mêmes que ceux du dashboard, rendus par les mêmes fonctions du
         noyau — mais seulement ceux qui parlent de budget : l'histogramme (et
         ses traits rouges, l'enveloppe de chaque catégorie) et le camembert en
         vue « Budget ». La vue « État actuel » n'a rien à faire ici.

         UNE COMPARAISON, ET SUR LES MÊMES GRAPHES : deux mois, deux années ou
         deux semaines. La période comparée est dessinée PAR-DESSUS, hachurée
         et grisée — barres superposées, anneau dans l'anneau (cf. app.js,
         « LA PÉRIODE COMPARÉE »). La période principale est celle de la barre
         du haut de page ; seule la comparée a ses propres listes. -->
    <h3>Tes dépenses face au budget<i class="info-bulle" tabindex="0" data-info-cle="analyse-budget.graphes">i</i></h3>
    <div class="selecteur-contexte ab-contexte ab-graphes-periode">
      <label for="ab-graphes-vue">Période
        <select id="ab-graphes-vue">
          <option value="mois">Mois</option>
          <option value="annee">Année</option>
          <option value="semaine">Semaine</option>
        </select>
      </label>
      <label for="ab-graphes-semaine" id="ab-graphes-semaine-bloc" style="display:none">Semaine
        <select id="ab-graphes-semaine"></select>
      </label>
      <label class="ab-comparer" for="ab-comparer">
        <input type="checkbox" id="ab-comparer" />
        Comparer avec
      </label>
      <label for="ab-cmp-annee" id="ab-cmp-annee-bloc" style="display:none">Année
        <select id="ab-cmp-annee"></select>
      </label>
      <label for="ab-cmp-mois" id="ab-cmp-mois-bloc" style="display:none">Mois
        <select id="ab-cmp-mois"></select>
      </label>
      <label for="ab-cmp-semaine" id="ab-cmp-semaine-bloc" style="display:none">Semaine
        <select id="ab-cmp-semaine"></select>
      </label>
    </div>
    <!-- CE QUI EST PLEIN ET CE QUI EST HACHURÉ, en toutes lettres : sans cette
         ligne, rien ne dit laquelle des deux périodes est laquelle. -->
    <p class="hint ab-graphes-legende" id="ab-graphes-legende"></p>
    <div class="dashboard-graphes ab-graphes">
      <div id="ab-histogramme" class="histogramme-cadre"></div>
      <div class="histogramme-cadre camembert-cadre">
        <div id="ab-camembert" class="camembert-zone"></div>
      </div>
    </div>
    <div id="ab-legende" class="histogramme-cadre legende-cadre"></div>

    <!-- ---------- CE QU'ON A MIS DE CÔTÉ ---------- -->
    <h3>Ce que tu as mis de côté<i class="info-bulle" tabindex="0" data-info-cle="analyse-budget.epargne">i</i></h3>

    <!-- LE NET EN GRAND, LE DÉTAIL AU SURVOL. Le net est la réponse — « j'ai mis
         2 300 € de côté cette année » — et les deux composantes disent ce qu'elle
         recouvre : un net à zéro peut vouloir dire « rien bougé » ou « 2 000
         versés et 2 000 repris ». La seconde information est nécessaire pour ne
         pas se tromper sur la première, sans mériter la même place.

         LES DOUZE MOIS SONT REPLIÉS DANS LA CARTE (bouton « Mois par mois ») :
         c'est la forme qui répond à « est-ce que je tiens un rythme ? », une
         question qu'on ne pose pas à chaque passage — dépliés d'office, les deux
         histogrammes de la page repoussaient tout le reste sous l'écran. -->
    <div class="ab-carte-net" id="ab-epargne-carte">
      <div id="ab-epargne-total"></div>
      <button type="button" class="ab-deplier" data-deplier="ab-epargne-mois" aria-expanded="false">Mois par mois</button>
      <div class="ab-carte-detail" id="ab-epargne-mois" hidden></div>
    </div>

    <!-- ---------- LE MATELAS DE SÉCURITÉ ---------- -->
    <h3>Matelas de sécurité<i class="info-bulle" tabindex="0" data-info-cle="analyse-budget.matelas">i</i></h3>

    <!-- Même forme que le réglage du budget du mois, et pour la même raison : un
         input hors <form> ne reçoit aucun style de l'application. -->
    <div class="reglage-ligne ab-matelas-reglage">
      <label for="ab-matelas-montant">Montant minimum à garder disponible</label>
      <input type="number" id="ab-matelas-montant" step="0.01" min="0" />
      <button type="button" class="primary" id="btn-ab-matelas">Enregistrer</button>
    </div>

    <div id="ab-matelas-etat"></div>

    <!-- ---------- CE QUI N'ÉTAIT PAS PRÉVISIBLE ---------- -->
    <h3>Dépenses imprévues<i class="info-bulle" tabindex="0" data-info-cle="analyse-budget.imprevues">i</i></h3>

    <div class="ab-carte-net" id="ab-imprevues-carte">
      <div id="ab-imprevues-total"></div>
      <button type="button" class="ab-deplier" data-deplier="ab-imprevues-mois" aria-expanded="false">Mois par mois</button>
      <div class="ab-carte-detail" id="ab-imprevues-mois" hidden></div>
    </div>


    <h4>Les lignes de l'année</h4>
    <table>
      <thead>
        <tr><th>Date</th><th>Nature</th><th>Catégorie</th><th>Montant</th></tr>
      </thead>
      <tbody id="ab-imprevues-lignes"></tbody>
    </table>
  </div>

  <!-- ---------- LES BUDGETS PAR CATÉGORIE, SUR LEUR PROPRE PAGE ----------

       POURQUOI ILS ONT DÉMÉNAGÉ. C'est un TABLEAU qu'on parcourt ligne à ligne
       en poussant des curseurs, souvent longuement — et il poussait à lui seul
       l'épargne, le matelas et les imprévues hors de l'écran. Les trois
       lectures du bas répondent à « qu'est-ce qui s'est passé » ; ce tableau-ci
       demande « qu'est-ce que je décide », et les deux gestes n'ont ni la même
       durée ni la même fréquence.

       SA BARRE DE CONTEXTE EST LA SIENNE, avec ses propres identifiants, et
       elle pilote le MÊME état que celle de l'onglet voisin (cf.
       analyse-budget.js, `AB_CONTEXTES`) : une enveloppe de catégorie est
       propre à un mois ET à une monnaie, exactement comme le budget du mois, et
       un onglet qui ne dirait pas lesquels laisserait régler vingt curseurs
       sans savoir sur quoi.

       DEUX BARRES PLUTÔT QU'UNE SEULE POSÉE AU-DESSUS DES ONGLETS : la
       troisième page de cette barre — « Projets » — n'a ni mois ni monnaie, et
       une barre commune y aurait posé trois listes sans effet. -->
  <div id="sous-section-budget-categories" class="sous-section">

    <div class="selecteur-contexte ab-contexte">
      <label for="ab-cat-monnaie">Monnaie
        <select id="ab-cat-monnaie"></select>
      </label>
      <label for="ab-cat-annee">Année
        <select id="ab-cat-annee"></select>
      </label>
      <label for="ab-cat-mois">Mois
        <select id="ab-cat-mois"></select>
      </label>
    </div>

    <h3>Budgets par catégorie<i class="info-bulle" tabindex="0" data-info-cle="analyse-budget.budgets-categories">i</i></h3>

    <div id="ab-budgets-categories" class="ab-budgets-categories"></div>
  </div>
</section>
