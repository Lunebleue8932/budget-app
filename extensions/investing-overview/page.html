<!-- Écran de l'extension « Vue d'ensemble des placements », injecté dans <main>
     par frontend/extensions.js. C'est un <section> comme ceux du noyau :
     switchSection le montre et le masque exactement de la même façon.

     PAS D'ONGLET DANS LA BARRE DU HAUT (`bouton: false` dans le manifeste) :
     cet écran est une façon de REGARDER le portefeuille, pas une destination à
     côté de lui. On y entre par un bouton posé dans le titre de la page
     Placements, on en ressort par celui de son propre en-tête — exactement le
     chemin de l'écran d'import. -->
    <section id="section-investing-overview">
      <h2 class="io-titre">
        Vue d'ensemble des placements
        <button type="button" id="btn-io-retour">Retour aux placements</button>
      </h2>

      <p class="hint" id="io-vide" style="display:none">
        Aucun titre détenu pour le moment. Achète ou importe des titres depuis la page
        Placements financiers, et la répartition apparaîtra ici.
      </p>

      <!-- Un onglet par monnaie de cotation, comme le dashboard : rien ne permet
           d'additionner des euros et des dollars, et un camembert qui les
           mélangerait donnerait des parts fausses avec l'air d'être juste. -->
      <div class="sous-onglets" id="io-monnaies"></div>

      <div id="io-contenu" style="display:none">
        <div class="io-kpis" id="io-kpis"></div>

        <!-- DEUX CAMEMBERTS, DEUX QUESTIONS, et elles ne se répondent pas
             l'une l'autre (migration 0066). Le premier dit COMMENT le
             portefeuille est détenu — du stock-picking, des ETF, des SCPI ; le
             second À QUOI il expose — actions, obligations, immobilier. Un ETF
             obligataire est les deux à la fois, et tant qu'une seule étiquette
             portait la question, « ETF 60 % / Actions 40 % » mélangeait des
             contenants et des contenus dans le même disque.

             LES MÊMES KPI POUR LES DEUX, en haut et une seule fois : ce sont
             les mêmes détentions, donc la même valeur et la même plus-value.
             Seul le découpage change. -->
        <h3>Comment c'est détenu<i class="info-bulle" tabindex="0" data-info-cle="investing-overview.repartition-par-type-de-titre">i</i></h3>
        <div class="io-camembert-bloc" data-io-axe="enveloppe">
          <div id="io-camembert-enveloppe"></div>
          <div id="io-legende-enveloppe" class="io-legende"></div>
        </div>

        <h3>À quoi c'est exposé<i class="info-bulle" tabindex="0" data-info-cle="investing-overview.repartition-par-classe">i</i></h3>
        <div class="io-camembert-bloc" data-io-axe="classe">
          <div id="io-camembert-classe"></div>
          <div id="io-legende-classe" class="io-legende"></div>
        </div>
      </div>
    </section>
