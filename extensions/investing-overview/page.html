<!-- Écran de l'extension « Vue d'ensemble des placements », injecté dans <main>
     par frontend/extensions.js. C'est un <section> comme ceux du noyau :
     switchSection le montre et le masque exactement de la même façon.

     PAS D'ONGLET DANS LA BARRE DU HAUT (`bouton: false` dans le manifeste) :
     cet écran est une façon de REGARDER le portefeuille, pas une destination à
     côté de lui. On y entre par un bouton posé dans le titre de la page
     Placements, on en ressort par celui de son propre en-tête — exactement le
     chemin de l'écran d'import. -->
    <section id="section-investing-overview">
      <!-- EN-TÊTE FIGÉ (cf. .page-entete) : le titre et la première rangée d'onglets. -->
      <div class="page-entete">
      <h2 class="io-titre">
        Vue d'ensemble des placements
        <button type="button" id="btn-io-retour">Retour aux placements</button>
      </h2>

      <!-- Un onglet par monnaie de cotation, comme le dashboard : rien ne permet
           d'additionner des euros et des dollars, et un camembert qui les
           mélangerait donnerait des parts fausses avec l'air d'être juste. -->
      <div class="sous-onglets" id="io-monnaies"></div>
      </div>

      <p class="hint" id="io-vide" style="display:none">
        Aucun titre détenu pour le moment. Achète ou importe des titres depuis la page
        Placements financiers, et la répartition apparaîtra ici.
      </p>

      <div id="io-contenu" style="display:none">
        <div class="io-kpis" id="io-kpis"></div>

        <!-- QUATRE CAMEMBERTS, DEUX PAR LIGNE. Le premier dit COMMENT le portefeuille est
             détenu — du stock-picking, des ETF, des SCPI ; les trois autres À QUOI il expose :
             la classe d'actif, la zone géographique, le secteur (migrations 0066 et 0076). Un
             ETF obligataire est à la fois une enveloppe et une classe, et tant qu'une seule
             étiquette portait la question, « ETF 60 % / Actions 40 % » mélangeait des
             contenants et des contenus dans le même disque.

             LA LÉGENDE SOUS SON DISQUE, et non à côté : deux camemberts par ligne ne laissent
             plus la place d'une colonne. Elle reprend celle du dashboard — même infobulle,
             même surbrillance de la part survolée.

             LES MÊMES KPI POUR LES QUATRE, en haut et une seule fois : ce sont les mêmes
             détentions, donc la même valeur et la même plus-value. Seul le découpage change. -->
        <div class="io-grille">
          <div class="io-cellule" data-io-axe="enveloppe">
            <h3>Comment c'est détenu<i class="info-bulle" tabindex="0" data-info-cle="investing-overview.repartition-par-type-de-titre">i</i></h3>
            <div class="io-camembert-bloc" data-io-axe="enveloppe">
              <div id="io-camembert-enveloppe" class="io-camembert"></div>
              <div id="io-legende-enveloppe" class="io-legende"></div>
            </div>
          </div>

          <div class="io-cellule" data-io-axe="classe">
            <h3>À quoi c'est exposé<i class="info-bulle" tabindex="0" data-info-cle="investing-overview.repartition-par-classe">i</i></h3>
            <div class="io-camembert-bloc" data-io-axe="classe">
              <div id="io-camembert-classe" class="io-camembert"></div>
              <div id="io-legende-classe" class="io-legende"></div>
            </div>
          </div>

          <div class="io-cellule" data-io-axe="zone">
            <h3>Où c'est exposé<i class="info-bulle" tabindex="0" data-info-cle="investing-overview.repartition-par-zone">i</i></h3>
            <div class="io-camembert-bloc" data-io-axe="zone">
              <div id="io-camembert-zone" class="io-camembert"></div>
              <div id="io-legende-zone" class="io-legende"></div>
            </div>
          </div>

          <div class="io-cellule" data-io-axe="secteur">
            <h3>Dans quels secteurs<i class="info-bulle" tabindex="0" data-info-cle="investing-overview.repartition-par-secteur">i</i></h3>
            <div class="io-camembert-bloc" data-io-axe="secteur">
              <div id="io-camembert-secteur" class="io-camembert"></div>
              <div id="io-legende-secteur" class="io-legende"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
