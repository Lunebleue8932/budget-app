<!-- Écran de l'extension « Monnaies ».

     L'id de la div est imposé par le manifeste (navigation.sous_section
     = "monnaies") : le noyau cherche exactement
     `sous-section-parametres-monnaies` pour y brancher le bouton d'onglet. -->
<div id="sous-section-parametres-monnaies" class="sous-section">
        <h3>Monnaies<i class="info-bulle" tabindex="0" data-info="Chaque monnaie garde ses propres soldes et budgets, jamais mélangés aux autres. Le symbole est ce qui s'affiche à côté des montants.">i</i></h3>
        <div id="monnaies-liste" class="import-mappings"></div>

        <!-- Le titre et le formulaire sont DÉPLACÉS sous la ligne éditée au
             double-clic (cf. ouvrirFormulaireEnLigne, dans le noyau) ; ils
             reviennent ici, en bloc de création, dès l'édition terminée. -->
        <h3 id="form-monnaie-titre">Ajouter une monnaie</h3>
        <form id="form-monnaie">
          <input type="hidden" id="monnaie-id" />
          <label>Nom
            <input type="text" id="monnaie-nom" placeholder="ex. Dollar américain" required />
          </label>
          <label>Symbole
            <input type="text" id="monnaie-symbole" placeholder="ex. $" maxlength="8" required />
          </label>
          <div class="actions">
            <button type="submit" class="primary">Enregistrer</button>
            <button type="button" id="monnaie-annuler" style="display:none">Annuler</button>
          </div>
        </form>

        <!-- LES TAUX, ET CE QU'ILS PERMETTENT. C'est le seul endroit de
             l'application d'où une conversion peut naître : partout ailleurs,
             les montants restent suivis monnaie par monnaie.

             UN SEUL BLOC, DEUX FAÇONS DE SAISIR. Il y en avait deux jusqu'ici :
             celui-ci pour un taux tapé à la main, et un second, posé par
             l'extension « Lecture de cours », pour un taux relu en ligne. Deux
             listes des mêmes couples, deux formulaires, deux titres « Taux de
             change » l'un sous l'autre — alors que ce sont les mêmes taux, dans
             la même table, qui servent à la même chose. Ils sont désormais
             fondus, et c'est un bouton qui choisit la façon de saisir. -->
        <h3 id="monnaies-taux-titre">Taux de change<i class="info-bulle" tabindex="0" data-info="Ce que vaut une monnaie dans une autre. Sert uniquement à la case « tout convertir » du dashboard, et ne modifie aucun montant enregistré. Un seul sens par couple suffit, l'inverse se calcule.">i</i></h3>

        <!-- Rempli par « Lecture de cours » quand elle tourne : le bouton de
             mise à jour et son compte rendu. Vide, il ne dessine rien. -->
        <div id="monnaies-taux-entete"></div>

        <div id="monnaies-taux-liste" class="import-mappings"></div>

        <form id="form-monnaie-taux">
          <!-- La barre des modes de saisie. MASQUÉE TANT QU'IL N'Y EN A QU'UN,
               comme toutes les barres d'onglets de l'application : sans
               « Lecture de cours », il n'y a que la saisie à la main et un
               bouton unique ne choisirait rien. -->
          <div class="sous-onglets full-width" id="monnaies-taux-modes"></div>

          <label for="monnaie-taux-source">1 unité de
            <select id="monnaie-taux-source"></select>
          </label>
          <label for="monnaie-taux-cible">vaut, en
            <select id="monnaie-taux-cible"></select>
          </label>

          <!-- Le champ propre au mode choisi : un nombre, ou un lien. -->
          <div class="full-width" id="monnaie-taux-saisie"></div>

          <div class="actions full-width">
            <button type="submit" class="primary" id="monnaie-taux-enregistrer">Enregistrer le taux</button>
          </div>
        </form>
</div>
