<!-- Écran de l'extension « Projets ».

     UN ONGLET DE LA PAGE BUDGET (cf. le manifeste : navigation.type = "onglet",
     hote_section = "budget"). Il vivait sur la page des comptes ; il n'y était
     pas à sa place. La vue globale des comptes dit ce qu'on A — des soldes, à
     aujourd'hui. Un projet dit ce qu'on a DÉCIDÉ de mettre dans un voyage ou un
     déménagement : exactement la même nature de décision que le budget d'un
     mois, à côté duquel il se range désormais.

     D'où la dépendance déclarée (`requiert_une_de`) : sans l'extension
     « Budget », cette page n'existe pas, et un onglet n'a pas d'hôte. Le noyau
     grise la case, refuse l'allumage et éteint Projets avec sa dépendance —
     l'extension n'a rien à en faire.

     C'est une `.sous-section` : c'est le gestionnaire délégué de app.js qui la
     montre et la cache, exactement comme un onglet du noyau. -->
<div id="sous-section-budget-projets" class="sous-section">
  <h3>Projets<i class="info-bulle" tabindex="0" data-info-cle="projets.projets">i</i></h3>
  <div class="actions">
    <button type="button" class="primary" id="btn-projet-nouveau">+ Nouveau projet</button>
  </div>

  <!-- Le formulaire de création/renommage. Replié tant qu'on ne l'ouvre pas :
       la liste est ce qu'on vient lire. -->
  <div id="projet-editeur" class="regle-editeur" style="display:none">
    <h4 id="projet-editeur-titre">Nouveau projet</h4>
    <input type="hidden" id="projet-id" />
    <div class="regle-champ-ligne">
      <label for="projet-nom">Nom</label>
      <input type="text" id="projet-nom" placeholder="ex. Vacances Italie" />
    </div>
    <div class="regle-champ-ligne">
      <label for="projet-description">Description</label>
      <input type="text" id="projet-description" placeholder="ex. du 3 au 17 août, Rome et Naples" />
    </div>
    <div class="actions">
      <button type="button" class="primary" id="btn-projet-enregistrer">Enregistrer</button>
      <button type="button" id="btn-projet-annuler">Annuler</button>
    </div>
  </div>

  <div id="projets-liste" class="projets-liste"></div>

  <!-- ----- Le projet ouvert ----- -->
  <div id="projet-detail" style="display:none">
    <div class="projet-detail-entete">
      <h3 id="projet-detail-nom"></h3>
      <button type="button" id="btn-projet-fermer">&larr; Retour aux projets</button>
    </div>
    <p class="hint" id="projet-detail-description"></p>

    <div class="projet-totaux" id="projet-detail-totaux"></div>

    <!-- L'HISTOGRAMME DU PROJET : le même graphe que celui du dashboard, sur
         les seules opérations que le projet regroupe. Le total dit ce que le
         voyage a coûté ; lui dit en quoi — hébergement, restaurants,
         transports — ce qu'aucune somme unique ne peut montrer.

         Rempli par projets.js, une section par monnaie (l'app n'en additionne
         jamais deux). Vide tant que le projet n'a aucune sortie : un cadre sans
         barre n'apprendrait rien. -->
    <!-- LA CASCADE DU PROJET (waterfall) : les entrées, puis chaque catégorie de
         dépense qui les entame, puis ce qu'il en reste. C'est la lecture
         « entrées contre dépenses » que ni le total ni l'histogramme ne donnent
         d'un coup d'œil. Une section par monnaie, comme l'histogramme. -->
    <h4 id="projet-waterfall-titre" style="display:none">Entrées et dépenses<i class="info-bulle" tabindex="0" data-info-cle="projets.cascade">i</i></h4>
    <div id="projet-waterfall"></div>

    <h4 id="projet-histogramme-titre" style="display:none">Répartition par catégorie<i class="info-bulle" tabindex="0" data-info-cle="projets.repartition-par-categorie">i</i></h4>
    <div id="projet-histogramme"></div>

    <div class="actions">
      <button type="button" class="primary" id="btn-projet-ajouter-operations">
        + Ajouter des opérations
      </button>
    </div>

    <!-- ----- Le sélecteur d'opérations ----- -->
    <div id="projet-selecteur" class="projet-selecteur" style="display:none">
      <h4>Ajouter des opérations<i class="info-bulle" tabindex="0" data-info-cle="projets.ajouter-des-operations">i</i></h4>
      <div class="projet-selecteur-filtres">
        <label for="projet-filtre-debut">Du
          <input type="date" id="projet-filtre-debut" />
        </label>
        <label for="projet-filtre-fin">Au
          <input type="date" id="projet-filtre-fin" />
        </label>
        <label for="projet-filtre-compte">Compte
          <select id="projet-filtre-compte"><option value="">— tous —</option></select>
        </label>
        <label for="projet-filtre-type">Type
          <select id="projet-filtre-type"><option value="">— tous —</option></select>
        </label>
        <label for="projet-filtre-categorie">Catégorie
          <select id="projet-filtre-categorie"><option value="">— toutes —</option></select>
        </label>
        <label for="projet-filtre-texte">Nature contient
          <input type="text" id="projet-filtre-texte" placeholder="ex. hôtel" spellcheck="false" />
        </label>
        <button type="button" class="primary" id="btn-projet-filtrer">Chercher</button>
      </div>

      <div class="actions barre-selection">
        <button type="button" id="btn-projet-tout-selectionner">Tout sélectionner</button>
        <button type="button" class="primary" id="btn-projet-verser" disabled>
          Ajouter au projet (<span id="projet-selection-nombre">0</span>)
        </button>
        <button type="button" id="btn-projet-selecteur-fermer">Fermer</button>
      </div>

      <div class="apercu-fichier-defilement">
        <table>
          <thead>
            <tr>
              <th>Nature</th><th>Montant</th><th>Compte</th><th>Date</th>
              <th>Catégorie</th><th>Sélection</th>
            </tr>
          </thead>
          <tbody id="projet-candidats-liste"></tbody>
        </table>
      </div>
      <p class="hint" id="projet-candidats-info"></p>
    </div>

    <h4>Opérations du projet — <span id="projet-detail-nombre"></span></h4>
    <table>
      <thead>
        <tr>
          <th>Nature</th><th>Montant</th><th>Compte</th><th>Date</th>
          <th>Catégorie</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="projet-operations-liste"></tbody>
    </table>
  </div>
</div>
