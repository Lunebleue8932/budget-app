<!-- Écran de l'extension « Règles de catégorisation ».

     UNE GREFFE, pas une sous-page (cf. le manifeste : navigation.type =
     "greffe", hote = "parametres-correspondances"). Le noyau pose ce bloc EN
     TÊTE de la page « Correspondances » et la rebaptise « Règles » tant que
     l'extension tourne — les règles s'écrivent au-dessus, les correspondances
     se constatent en dessous, comme avant que les deux ne soient séparées.

     Ce n'est donc PAS une `.sous-section` : l'affichage est celui de la page
     hôte, et lui en remettre une le cacherait derrière une classe `active` que
     personne ne lui poserait jamais. -->
<div id="regles-bloc">
  <h3>Règles de catégorisation<i class="info-bulle" tabindex="0" data-info-cle="regles.regles-de-categorisation">i</i></h3>

  <div class="regles-barre">
    <div class="actions">
      <button type="button" class="primary" id="btn-regle-nouvelle">+ Nouvelle règle</button>
    </div>
    <!-- Deux vues sur les MÊMES règles, dans le MÊME ordre : la galerie ne
         range pas, elle regroupe. Le rang affiché sur chaque carte reste celui
         de l'évaluation, quel que soit le dossier où la carte est posée. -->
    <div class="sous-onglets regles-vues">
      <button type="button" class="active" data-vue-regles="liste">Vue liste</button>
      <button type="button" data-vue-regles="galerie">Vue galerie</button>
    </div>
  </div>

  <div id="regles-liste"></div>

  <div id="regles-galerie" style="display:none">
    <div class="actions">
      <button type="button" id="btn-regle-dossier-nouveau">+ Nouveau dossier</button>
    </div>
    <div id="regles-dossiers"></div>
  </div>

  <div id="regle-editeur" class="regle-editeur" style="display:none">
    <h3 id="regle-editeur-titre">Nouvelle règle</h3>
    <input type="hidden" id="regle-id" />

    <div class="regle-champ-ligne">
      <label for="regle-nom">Nom de la règle</label>
      <input type="text" id="regle-nom" placeholder="ex. Prêts reçus" />
    </div>

    <!-- LA NOTE : pourquoi cette règle existe, ce que le nom et les conditions
         ne disent pas. Jamais lue par l'app — ni filtrée, ni comparée, ni
         déclenchée (cf. migration 0050). Un <textarea> et non un <input> :
         c'est une phrase ou trois, pas une étiquette. -->
    <div class="regle-champ-ligne">
      <label for="regle-description">Description<i class="info-bulle" tabindex="0" data-info-cle="regles.description">i</i></label>
      <textarea id="regle-description" rows="2" placeholder="ex. la banque écrit « VIR RECU M DUPONT » pour les remboursements de Paul"></textarea>
    </div>

    <h4>Conditions<i class="info-bulle" tabindex="0" data-info-cle="regles.conditions">i</i></h4>
    <div class="regle-champ-ligne">
      <label for="regle-connecteur">Combiner les groupes avec</label>
      <select id="regle-connecteur">
        <option value="ET">ET (tous les groupes)</option>
        <option value="OU">OU (au moins un groupe)</option>
      </select>
    </div>
    <div id="regle-groupes"></div>
    <div class="actions">
      <button type="button" id="btn-regle-ajouter-groupe">+ Ajouter un groupe</button>
    </div>

    <h4>Action<i class="info-bulle" tabindex="0" data-info-cle="regles.action">i</i></h4>
    <div class="regle-champ-ligne">
      <label for="regle-type">Classer comme</label>
      <select id="regle-type">
        <option value="classique">Opération classique</option>
        <option value="remboursable">Dépense remboursable</option>
        <option value="remboursements">Remboursement reçu</option>
        <option value="remboursement_pret">Remboursement de prêt</option>
        <option value="pret">Prêt reçu</option>
        <option value="virement">Virement interne</option>
      </select>
    </div>
    <div class="regle-champ-ligne" id="regle-categorie-bloc">
      <label for="regle-categorie">Dans la catégorie</label>
      <select id="regle-categorie"><option value="">— ne pas changer —</option></select>
    </div>
    <p class="hint" id="regle-categorie-imposee" style="display:none"></p>
    <!-- DÉCOUPE : la règle ne pose plus une catégorie mais une répartition.
         Une règle est écrite une fois pour des lignes dont elle ignore le
         montant : chaque part porte donc une FORMULE et non un nombre. -->
    <label class="import-option-ligne" id="regle-decoupee-bloc">
      <input type="checkbox" id="regle-decoupee" />
      Découper entre plusieurs catégories<i class="info-bulle" tabindex="0" data-info-cle="regles.decouper-entre-plusieurs-categories">i</i>
    </label>
    <div id="regle-decoupe-bloc" style="display:none">
      <div id="regle-decoupe-parts"></div>
      <div class="actions">
        <button type="button" id="btn-regle-decoupe-ajouter">+ Ajouter une part</button>
      </div>
    </div>
    <!-- Un virement décrit DEUX comptes, et le relevé n'en nomme qu'un.
         Sans ce second compte, chaque ligne reconnue par la règle doit
         être reprise à la main dans l'aperçu avant de pouvoir être
         importée. -->
    <div class="regle-champ-ligne" id="regle-compte-autre-bloc" style="display:none">
      <label for="regle-compte-autre">Avec le compte en face<i class="info-bulle" tabindex="0" data-info-cle="regles.avec-le-compte-en-face">i</i></label>
      <select id="regle-compte-autre"><option value="">— à renseigner à l'import —</option></select>
    </div>
    <label class="import-option-ligne">
      <input type="checkbox" id="regle-actif" checked />
      Règle active
    </label>
    <label class="import-option-ligne">
      <input type="checkbox" id="regle-arreter-apres" checked />
      Arrêter la lecture des règles ici<i class="info-bulle" tabindex="0" data-info-cle="regles.arreter-la-lecture-des-regles-ici">i</i>
    </label>

    <div class="actions">
      <button type="button" class="primary" id="btn-regle-enregistrer">Enregistrer</button>
      <button type="button" id="btn-regle-annuler">Annuler</button>
    </div>
  </div>
</div>
